<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>DigiGrid</title>
		<style>
			body {
				background-color: gray;
			}
			canvas {
				border: 1px solid black;
				background-color: #DDDDDD;
			}
		</style>
	</head>
	<body>
		<canvas id="canvas-id"
			width="1000"
			height="600"
			oncontextmenu="event.preventDefault()" <!-- Don't open a right-click menu when clicking inside canvas -->
			tabindex="1" <!-- Make canvas focusable for keyboard input -->
		></canvas>
		<script src="digigrid.mjs" defer></script>

		<br>
		<!--<a
			href="javascript:void(0);"
			onclick="console.log('Clicked 2')"
		>Download Map</a>-->

		<button onclick="downloadMap()">
			Download Map
		</button>
		<input
			type="file"
			id="fileInput"
			accept=".json"
		/>
	</body>
</html>
